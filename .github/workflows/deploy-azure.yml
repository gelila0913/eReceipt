name: CI/CD Pipeline - Build, Test & Deploy to Azure

on:
  push:
    branches:
      - main
      - Fani
    paths-ignore:
      - '**.md'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: azure-deployment
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Test & Validate Code (CI)
  # ----------------------------------------------------------------------------
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Build & Validate Backend
        run: |
          cd Backend
          npm ci
          npm run build

      - name: Build & Validate Frontend
        run: |
          cd Frontend/ereceipt
          npm ci
          npm run build

  # ----------------------------------------------------------------------------
  # Job 2: Build & Push Docker Containers, then Deploy to Azure (CD)
  # ----------------------------------------------------------------------------
  deploy:
    name: Build Containers & Deploy to Azure
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure CLI
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: az acr login --name acrereceipt23993

      - name: Set Image Tag
        id: vars
        run: echo "SHA_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and Push Backend Docker Image
        run: |
          docker build \
            -t acrereceipt23993.azurecr.io/ereceipt-backend:latest \
            -t acrereceipt23993.azurecr.io/ereceipt-backend:${{ steps.vars.outputs.SHA_TAG }} \
            ./Backend
          docker push acrereceipt23993.azurecr.io/ereceipt-backend:latest
          docker push acrereceipt23993.azurecr.io/ereceipt-backend:${{ steps.vars.outputs.SHA_TAG }}

      - name: Build and Push Frontend Docker Image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL="https://backend.salmonwater-89ba5a67.southafricanorth.azurecontainerapps.io" \
            -t acrereceipt23993.azurecr.io/ereceipt-frontend:latest \
            -t acrereceipt23993.azurecr.io/ereceipt-frontend:${{ steps.vars.outputs.SHA_TAG }} \
            ./Frontend/ereceipt
          docker push acrereceipt23993.azurecr.io/ereceipt-frontend:latest
          docker push acrereceipt23993.azurecr.io/ereceipt-frontend:${{ steps.vars.outputs.SHA_TAG }}

      - name: Deploy to Azure Container Apps
        run: |
          echo "Updating live Backend container..."
          az containerapp update \
            --name backend \
            --resource-group rg-ereceipt-prod \
            --image acrereceipt23993.azurecr.io/ereceipt-backend:${{ steps.vars.outputs.SHA_TAG }}

          echo "Updating live Frontend container..."
          az containerapp update \
            --name ereceipt-frontend \
            --resource-group rg-ereceipt-prod \
            --image acrereceipt23993.azurecr.io/ereceipt-frontend:${{ steps.vars.outputs.SHA_TAG }}

          echo "🚀 CI/CD Deployment succeeded! Both containers are now updated."
